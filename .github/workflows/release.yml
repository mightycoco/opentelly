name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate release branch
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "branch") {
            throw "Releases must be dispatched from a branch"
          }
          if ($env:RELEASE_REF -ne $env:DEFAULT_BRANCH) {
            throw "Releases must be dispatched from the default branch ($env:DEFAULT_BRANCH)"
          }

      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Bump application version
        id: version
        shell: pwsh
        env:
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          $version = python scripts/bump_version.py $env:VERSION_INCREMENT
          if ($LASTEXITCODE -ne 0) {
            throw "Version increment failed"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Commit version and create tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether release tag $env:RELEASE_TAG exists"
          }
          if ($existingTag) {
            throw "Release tag $env:RELEASE_TAG already exists"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/iptv_player/__init__.py
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit the version bump"
          }
          git tag -a $env:RELEASE_TAG -m "Open Telly $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create tag $env:RELEASE_TAG"
          }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the version commit to $env:GITHUB_REF_NAME"
          }
          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push tag $env:RELEASE_TAG"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create $env:RELEASE_TAG --title "Open Telly $env:RELEASE_VERSION" --generate-notes --verify-tag
