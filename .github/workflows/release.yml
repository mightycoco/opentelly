name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semantic version component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate release branch
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "branch") {
            throw "Releases must be dispatched from a branch"
          }
          if ($env:RELEASE_REF -ne $env:DEFAULT_BRANCH) {
            throw "Releases must be dispatched from the default branch ($env:DEFAULT_BRANCH)"
          }

      - name: Check out selected branch
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_REF: ${{ github.ref_name }}
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) {
            throw "Could not initialize the checkout directory"
          }
          git remote add origin "https://github.com/$env:CHECKOUT_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not configure the checkout remote"
          }
          $authorization = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:CHECKOUT_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" fetch `
            --prune --tags origin `
            "+refs/heads/$env:CHECKOUT_REF`:refs/remotes/origin/$env:CHECKOUT_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch branch $env:CHECKOUT_REF"
          }
          git checkout -B $env:CHECKOUT_REF "refs/remotes/origin/$env:CHECKOUT_REF"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out branch $env:CHECKOUT_REF"
          }

      - name: Set up Python
        shell: pwsh
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE "Python"
          $pythonInstall = Get-ChildItem -LiteralPath $pythonRoot -Directory |
            Where-Object { $_.Name -match '^3\.12\.\d+$' } |
            Sort-Object { [Version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64" } |
            Where-Object { Test-Path (Join-Path $_ "python.exe") } |
            Select-Object -First 1
          if (-not $pythonInstall) {
            throw "Python 3.12 was not found in the runner tool cache at $pythonRoot"
          }
          $pythonScripts = Join-Path $pythonInstall "Scripts"
          "$pythonInstall" >> $env:GITHUB_PATH
          "$pythonScripts" >> $env:GITHUB_PATH
          & (Join-Path $pythonInstall "python.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "Could not start the runner's Python 3.12 installation"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Bump application version
        id: version
        shell: pwsh
        env:
          VERSION_INCREMENT: ${{ inputs.increment }}
        run: |
          $version = python scripts/bump_version.py $env:VERSION_INCREMENT
          if ($LASTEXITCODE -ne 0) {
            throw "Version increment failed"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip.install --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install 7-Zip for the mpv runtime archive"
          }

      - name: Download and verify LGPL libmpv runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip was not installed at $sevenZip"
          }
          ./scripts/fetch_mpv_runtime.ps1 `
            -RuntimeDirectory "$env:RUNNER_TEMP\mpv-runtime" `
            -SevenZipPath $sevenZip
          if ($LASTEXITCODE -ne 0) {
            throw "Could not stage the verified LGPL libmpv runtime"
          }

      - name: Package source and runtime
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python scripts/package_source.py `
            --runtime-dir "$env:RUNNER_TEMP\mpv-runtime" `
            --output "dist/OpenTelly-$env:RELEASE_VERSION-source.zip" `
            --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the Open Telly source distribution"
          }

      - name: Commit version and create tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          $authorization = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:RELEASE_TOKEN")
          )
          $existingTag = git -c "http.extraheader=AUTHORIZATION: basic $authorization" `
            ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether release tag $env:RELEASE_TAG exists"
          }
          if ($existingTag) {
            throw "Release tag $env:RELEASE_TAG already exists"
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/iptv_player/__init__.py
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit the version bump"
          }
          git tag -a $env:RELEASE_TAG -m "Open Telly $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create tag $env:RELEASE_TAG"
          }
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" `
            push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the version commit to $env:GITHUB_REF_NAME"
          }
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" `
            push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push tag $env:RELEASE_TAG"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create $env:RELEASE_TAG --title "Open Telly $env:RELEASE_VERSION" --generate-notes --verify-tag "dist/OpenTelly-$env:RELEASE_VERSION-source.zip"
